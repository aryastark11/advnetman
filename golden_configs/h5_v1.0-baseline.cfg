#!/bin/bash
# Live Container Startup Configuration for h5

#!/bin/bash
while ! ip link show dev eth1 >/dev/null 2>&1; do
  sleep 0.5
done
ip link set dev eth1 address aa:c1:ab:00:10:05 up
sleep 1
ip link add link eth1 name eth1.10 type vlan id 10
ip link set dev eth1.10 address aa:c1:ab:00:10:05 up
sleep 1
ip addr add 10.70.10.105/24 dev eth1.10 || true
ip route replace default via 10.70.10.1 dev eth1.10
ip -6 addr add 2001:db8:70:10::105/64 dev eth1.10 || true
ip -6 route replace default via 2001:db8:70:10::1 dev eth1.10 || true
echo "nameserver 198.51.100.10" > /etc/resolv.conf || true
tail -f /dev/null
