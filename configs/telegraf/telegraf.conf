[global_tags]
  lab = "lab2_3_network_automation"
  environment = "arista_ceos_cluster"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  logfile = ""
  hostname = "nmas-telegraf"
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

[[outputs.influxdb]]
  urls = ["http://172.20.20.201:8086"]
  database = "nmas_datalake"
  timeout = "5s"

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# 1. SNMP Monitoring Inputs for Arista cEOS Routers & Switches
[[inputs.snmp]]
  agents = [
    "172.20.20.11:161",
    "172.20.20.12:161",
    "172.20.20.13:161",
    "172.20.20.14:161",
    "172.20.20.15:161",
    "172.20.20.21:161",
    "172.20.20.22:161",
    "172.20.20.23:161",
    "172.20.20.24:161"
  ]
  version = 2
  community = "public"
  name = "telegraf_snmp"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid = "1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.field]]
    name = "cpu_utilization"
    oid = "1.3.6.1.2.1.25.3.3.1.2.1"

  [[inputs.snmp.field]]
    name = "sys_descr"
    oid = "1.3.6.1.2.1.1.1.0"

  [[inputs.snmp.table]]
    name = "telegraf_interface_stats"
    inherit_tags = ["hostname"]
    oid = "IF-MIB::ifTable"

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "IF-MIB::ifDescr"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "IF-MIB::ifOperStatus"

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = "IF-MIB::ifInOctets"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = "IF-MIB::ifOutOctets"

# 2. Host and Network Monitoring (ICMP Reachability)
[[inputs.ping]]
  urls = [
    "172.20.20.11",
    "172.20.20.12",
    "172.20.20.13",
    "172.20.20.14",
    "172.20.20.15",
    "172.20.20.21",
    "172.20.20.22",
    "172.20.20.23",
    "172.20.20.24",
    "172.20.20.100"
  ]
  count = 1
  timeout = 1.0
  name_override = "device_ping"
