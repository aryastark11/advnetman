# ======================================================================
# FreeRADIUS Client Definitions for Containerlab Network (CSCI 5840)
# ======================================================================

client localhost {
    ipaddr = 127.0.0.1
    secret = RadiusSecret2026!
    require_message_authenticator = no
    nastype = other
}

client localhost_ipv6 {
    ipv6addr = ::1
    secret = RadiusSecret2026!
    require_message_authenticator = no
}

client lab_network_172 {
    ipaddr = 172.20.20.0/24
    secret = RadiusSecret2026!
    require_message_authenticator = no
    nastype = other
}

client lab_network_10 {
    ipaddr = 10.99.0.0/24
    secret = RadiusSecret2026!
    require_message_authenticator = no
    nastype = other
}
