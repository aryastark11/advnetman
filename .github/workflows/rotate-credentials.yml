name: Rotate Network Device Credentials

on:
  schedule:
    # Monthly on the 1st at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target Device hostname (leave blank for all devices)'
        required: false
        default: ''
      dry_run:
        description: 'Execute as Dry-Run simulation'
        type: boolean
        default: false

jobs:
  rotate:
    name: Rotate Device Credentials via Vault AppRole
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install hvac pyeapi pyotp

      - name: Execute Rotation Script
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          CMD="python3 scripts/rotate_passwords.py --stagger 2.0"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "${{ github.event.inputs.target_device }}" ]; then
            CMD="$CMD --device ${{ github.event.inputs.target_device }}"
          fi
          echo "Executing: $CMD"
          eval $CMD
