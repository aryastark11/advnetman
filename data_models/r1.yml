hostname: r1
vendor: arista
tier: distribution
device_type: router
role: Distribution Router (VLAN 10/20 Routing, RIPv2, OSPF Area 0)
mgmt_ip: 172.20.20.11/24
mgmt_ipv6: 2001:db8:ffff::5/64
private_ip: 10.0.0.1
public_ip: null
ospf:
  process_id: 1
  router_id: 10.0.0.1
  redistribute:
  - connected
  - rip
rip:
  enabled: true
  networks:
  - 10.10.10.0/24
  - 10.10.20.0/24
  redistribute:
  - ospf
interfaces:
- name: Ethernet1
  cisco_name: GigabitEthernet0/0/0/0
  sonic_name: Ethernet0
  ip: 10.0.0.1/24
  ipv6: 2001:db8::1/64
  ospf_area: 0.0.0.0
  description: Core Link to S3 (OSPF Area 0)
- name: Ethernet2
  cisco_name: GigabitEthernet0/0/0/1
  sonic_name: Ethernet4
  routed: true
  description: 802.1Q Trunk Link to S1
subinterfaces:
- parent: Ethernet2
  sub_id: 10
  vlan_id: 10
  ip: 10.10.10.1/24
  ipv6: 2001:db8:10::1/64
  rip_enabled: true
  description: VLAN 10 Gateway Sub-interface
- parent: Ethernet2
  sub_id: 20
  vlan_id: 20
  ip: 10.10.20.1/24
  ipv6: 2001:db8:20::1/64
  rip_enabled: true
  description: VLAN 20 Gateway Sub-interface
